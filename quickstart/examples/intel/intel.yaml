sampleApplication:
  baseConfigMapRefName: basic-gpu-preset
  model:
    modelArtifactURI: hf://meta-llama/Llama-2-7b-chat-hf
    modelName: "meta-llama/Llama-2-7b-chat-hf"
  resources:
    limits:
      habana.ai/gaudi: 4
    requests:
      habana.ai/gaudi: 4
redis:
  enabled: true
modelservice:
  vllm:
    image:
      registry: docker.io
      repository: stevesloka/vllm-hpu-env
      tag: latest
  routingProxy: 
    image:
      registry: docker.io
      repository: stevesloka/llm-d-routing-sidecar
      tag: 0.0.1.a
  epp:
    defaultEnvVarsOverride:
      - name: ENABLE_KVCACHE_AWARE_SCORER
        value: "true"
      - name: ENABLE_PREFIX_AWARE_SCORER
        value: "true"
      - name: ENABLE_LOAD_AWARE_SCORER
        value: "true"
      - name: ENABLE_SESSION_AWARE_SCORER
        value: "true"
      - name: PD_ENABLED
        value: "true"
      - name: PD_PROMPT_LEN_THRESHOLD
        value: "10"
      - name: PREFILL_ENABLE_KVCACHE_AWARE_SCORER
        value: "true"
      - name: PREFILL_ENABLE_LOAD_AWARE_SCORER
        value: "true"
      - name: PREFILL_ENABLE_PREFIX_AWARE_SCORER
        value: "true"
      - name: PREFILL_ENABLE_SESSION_AWARE_SCORER
        value: "true"
