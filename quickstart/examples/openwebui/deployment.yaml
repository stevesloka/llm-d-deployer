apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm-d
spec:
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.6.15
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: "http://llm-d-inference-gateway-istio/v1"